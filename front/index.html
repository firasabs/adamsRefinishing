<html lang="he">
<head>
  <meta charset="UTF-8" />

  <title>מצבעת אדם | Adam Painting</title>

<body>
  <header>
    <div class="logo-container">
      <img src="images/logo/adam's painting.png" alt="Adam Painting Logo">
      <h1>מצבעת אדם</h1>

    <nav>
      <a href="#gallery">עבודות</a>
      <a href="#contact">צור קשר</a>

<section class="intro">
  <h2>צביעה וחידוש מטבחים ורהיטים</h2>

</section>

            <img src="images/kitchens/after1.jpg" alt="After" />

            <span class="arrows">↔</span>
          </div>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="slide">
