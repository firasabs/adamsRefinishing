<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מצבעת אדם | Adam Painting</title>
  <link rel="stylesheet" href="front/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
  
<body>
  <header>
    <div class="logo-container">
      <img src="front/images/logo/adam's painting.png" alt="Adam Painting Logo">
      <h1>מצבעת אדם</h1>
    </div>
    <nav>
      <a href="#all-works">עבודות</a>
      <a href="#contact">צור קשר</a>
      <a href="front/about.html">קצת עלינו</a>

    </nav>
  </header>

  <section class="hero hero-image">
    <div class="hero-inner">
      <h1>צביעה וחידוש מטבחים ורהיטים</h1>
      <p>מאז 1986 — אמנות, יצירה ומקצועיות. חידוש מטבחים, דלתות ורהיטים בגימור מושלם.</p>

      <div class="hero-cta">
        <a href="#all-works" class="btn btn-outline">עבודות</a>
        <a href="#contact" class="btn btn-solid">קבלו הצעת מחיר</a>
      </div>
    </div>
  </section>

  <section class="gallery-section" id="gallery">
    <h2>שיפוץ / חידוש</h2>
    <p>לפני ואחרי </p>
    <div class="carousel-container">
      <!-- Slide 1 -->
      <div class="slide active">
        <div class="slider-wrapper">
          <img src="front/images/kitchens/before1.jpeg" class="before-img" alt="Before" />
          <div class="overlay">
            <img src="front/images/kitchens/after1.jpg" alt="After" />
          </div>
          <div class="handle">
            <span class="arrows">↔</span>
          </div>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="slide">
        <div class="slider-wrapper">
          <img src="front/images/kitchens/before2.jpg" class="before-img" alt="Before" />
          <div class="overlay">
            <img src="front/images/kitchens/after2.jpg" alt="After" />
          </div>
          <div class="handle">
            <span class="arrows">↔</span>
          </div>
        </div>
      </div>
            <!-- Slide 3 -->
      <div class="slide">
        <div class="slider-wrapper">
          <img src="front/images/doors/door1B_resized.jpg" class="before-img" alt="Before" />
          <div class="overlay">
            <img src="front/images/doors/door1A_resized.jpg" alt="After" />
          </div>
          <div class="handle">
            <span class="arrows">↔</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <span class="page-dot active" data-index="0">1</span>
      <span class="page-dot" data-index="1">2</span>
      <span class="page-dot" data-index="2">3</span>

    </div>
  </section>
  <section class="full-gallery" id="all-works">
  <h2>כל העבודות</h2>
  
  <!-- Filter buttons -->
  <div class="filter-buttons">
    <button data-filter="all" class="active">הצג הכל</button>
    <button data-filter="kitchen">מטבחים</button>
    <button data-filter="doors">דלתות</button>
    <button data-filter="furniture">רהיטים</button>
    <button data-filter="dekts">דיקטים</button>
    <button data-filter="windows">חלונות</button>

  </div>
