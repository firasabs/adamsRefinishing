<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-reveal-kitchen-1"
        class="scene"
        data-composition-id="02-reveal-kitchen-1"
        data-composition-src="compositions/frames/02-reveal-kitchen-1.html"
        data-start="3"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-reveal-kitchen-2"
        class="scene"
        data-composition-id="03-reveal-kitchen-2"
        data-composition-src="compositions/frames/03-reveal-kitchen-2.html"
        data-start="8"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-reveal-door"
        class="scene"
        data-composition-id="04-reveal-door"
        data-composition-src="compositions/frames/04-reveal-door.html"
        data-start="13"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-reveal-furniture"
        class="scene"
        data-composition-id="05-reveal-furniture"
        data-composition-src="compositions/frames/05-reveal-furniture.html"
        data-start="17"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-proof-stat"
        class="scene"
        data-composition-id="06-proof-stat"
        data-composition-src="compositions/frames/06-proof-stat.html"
        data-start="21.5"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta-outro"
        class="scene"
        data-composition-id="07-cta-outro"
        data-composition-src="compositions/frames/07-cta-outro.html"
        data-start="25"
        data-duration="4"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 3);
        tl.fromTo("#el-02-reveal-kitchen-1", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3);
        tl.to("#el-02-reveal-kitchen-1", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-03-reveal-kitchen-2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.to("#el-03-reveal-kitchen-2", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-04-reveal-door", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-04-reveal-door", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-05-reveal-furniture", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.to("#el-05-reveal-furniture", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 21.5);
        tl.fromTo("#el-06-proof-stat", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 21.5);
        tl.to("#el-06-proof-stat", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-07-cta-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.to({}, { duration: 29 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
