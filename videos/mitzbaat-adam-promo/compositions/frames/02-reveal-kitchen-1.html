<template>
  <style>
    /* Root — styled by #root only (never a class; scoping rule). */
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }

    /* Full-bleed ground — a dedicated class="clip" layer, never painted on #root. */
    [data-role="bg"] {
      position: absolute;
      inset: 0;
      background: #ffffff;
    }

    /* Content stage — hosts the perspective for the book-open tilt. */
    [data-role="stage"] {
      position: absolute;
      inset: 0;
      perspective: 1600px;
    }

    [data-role="split-stage"] {
      position: absolute;
      top: 160px;
      left: 60px;
      width: 960px;
      height: 1280px;
      display: flex;
      gap: 40px;
      transform-style: preserve-3d;
      z-index: 1;
    }

    [data-role="card"] {
      position: relative;
      width: 460px;
      height: 1280px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    [data-role="card-media"] {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 3px solid #111111;
      border-radius: 0;
      background: #ffffff;
    }

    [data-role="card-media"] img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Badges live on the stage parent, never inside a tilted card (they'd inherit rotateY). */
    [data-role="badge"] {
      position: absolute;
      top: 763px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 190px;
      height: 74px;
      background: #b8893e;
      border-radius: 4px;
      color: #ffffff;
      font-family: sans-serif;
      font-weight: 800;
      font-size: 34px;
      line-height: 1;
      transform-origin: 50% 50%;
      will-change: transform;
      z-index: 2;
    }

    [data-role="badge"][data-side="left"] {
      left: 359px;
    }

    [data-role="badge"][data-side="right"] {
      left: 529px;
    }
  </style>

  <div id="root" data-composition-id="02-reveal-kitchen-1" data-width="1080" data-height="1920">
    <div
      class="clip 02-reveal-kitchen-1-bg"
      data-role="bg"
      data-start="0"
      data-duration="5"
      data-track-index="0"
    ></div>

    <div
      class="clip 02-reveal-kitchen-1-stage"
      data-role="stage"
      data-start="0"
      data-duration="5"
      data-track-index="1"
    >
      <div class="02-reveal-kitchen-1-split-stage" data-role="split-stage">
        <div class="02-reveal-kitchen-1-card" data-role="card" data-side="left">
          <div data-role="card-media">
            <img src="assets/before2.jpg" alt="" />
          </div>
        </div>
        <div class="02-reveal-kitchen-1-card" data-role="card" data-side="right">
          <div data-role="card-media">
            <img src="assets/after2.jpg" alt="" />
          </div>
        </div>
      </div>

      <div class="02-reveal-kitchen-1-badge" data-role="badge" data-side="left" dir="rtl">לפני</div>
      <div class="02-reveal-kitchen-1-badge" data-role="badge" data-side="right" dir="rtl">אחרי</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-reveal-kitchen-1"]');
      var cardLeft = root.querySelector('[data-role="card"][data-side="left"]');
      var cardRight = root.querySelector('[data-role="card"][data-side="right"]');
      var badgeLeft = root.querySelector('[data-role="badge"][data-side="left"]');
      var badgeRight = root.querySelector('[data-role="badge"][data-side="right"]');

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.9s): split-tilt entry (signature move) ----
      // before2.jpg (left) enters from the left with +tilt rotateY book-open;
      // after2.jpg (right) enters ~0.2s behind, mirrored -tilt; both scale 0.85→1.
      var TILT = 14;
      var OVERSHOOT = 8;
      var SLIDE = 220;
      var ENTRY_DUR = 0.9;

      tl.fromTo(
        cardLeft,
        { x: -SLIDE, rotateY: TILT + OVERSHOOT, scale: 0.85, opacity: 0 },
        { x: 0, rotateY: TILT, scale: 1, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
        0.0,
      );
      tl.fromTo(
        cardRight,
        { x: SLIDE, rotateY: -(TILT + OVERSHOOT), scale: 0.85, opacity: 0 },
        { x: 0, rotateY: -TILT, scale: 1, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
        0.2,
      );

      // ---- Scene 2 (1.9–2.8s): inner-edge badge spring-pop (the lone overshoot) ----
      tl.fromTo(
        badgeLeft,
        { scale: 0, y: 18, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" },
        1.9,
      );
      tl.fromTo(
        badgeRight,
        { scale: 0, y: 18, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" },
        2.2,
      );

      // ---- Scene 3 (2.8–5.0s): held spread, phase-opposed idle float ----
      // left sin(t), right sin(t + pi) — never synchronized; subtle jitter only.
      var IDLE_START = 2.8;
      var IDLE_DUR = 2.2;
      var CYCLES = 1;
      var Y_AMP = 3;
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            gsap.set(cardLeft, { y: s * Y_AMP });
            gsap.set(cardRight, { y: -s * Y_AMP }); // sin(t + pi) = -sin(t)
          },
        },
        IDLE_START,
      );

      window.__timelines["02-reveal-kitchen-1"] = tl;
    })();
  </script>
</template>
